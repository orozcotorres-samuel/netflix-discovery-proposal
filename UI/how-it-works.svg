<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="560" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="22" font-weight="500" fill="#1D1D1F">One new input. Everything else already exists.</text>
  <text x="30" y="64" font-size="14" fill="#6E6E73">Following one request: &#8220;good drama movie I haven&#8217;t seen before&#8221;</text>

  <!-- ===== Row A : the new path ===== -->
  <rect x="30" y="110" width="210" height="84" rx="4" fill="#FFF0F1" stroke="#E50914" stroke-width="0.5"/>
  <rect x="182" y="122" width="46" height="18" rx="9" fill="#E50914"/>
  <text x="205" y="135" font-size="10" font-weight="500" fill="#FFFFFF" text-anchor="middle">NEW</text>
  <text x="54" y="142" font-size="14" font-weight="500" fill="#8B0007">What you say</text>
  <text x="54" y="162" font-size="12" fill="#B3000A">Typed, spoken, or tapped</text>
  <text x="54" y="180" font-size="10" fill="#B3000A">Netflix Discovery &#8211; Missing Input</text>

  <line x1="240" y1="152" x2="284" y2="152" stroke="#E50914" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="110" width="180" height="84" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="312" y="142" font-size="14" font-weight="500" fill="#1D1D1F">Parse &amp; route</text>
  <text x="312" y="162" font-size="12" fill="#6E6E73">Splits the sentence</text>
  <text x="312" y="180" font-size="11" fill="#86868B">Netflix-adapted LLM</text>

  <!-- ===== Row B : the existing path ===== -->
  <rect x="30" y="300" width="210" height="84" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="54" y="332" font-size="14" font-weight="500" fill="#1D1D1F">What you&#8217;ve watched</text>
  <text x="54" y="352" font-size="12" fill="#6E6E73">History, device, time</text>
  <text x="54" y="370" font-size="11" fill="#86868B">Behavioural traces</text>

  <line x1="240" y1="342" x2="284" y2="342" stroke="#86868B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="300" width="180" height="84" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="312" y="332" font-size="14" font-weight="500" fill="#1D1D1F">Infer the rest</text>
  <text x="312" y="352" font-size="12" fill="#6E6E73">Predicts intent</text>
  <text x="312" y="370" font-size="11" fill="#86868B">FM-Intent</text>

  <!-- ===== Converge into intent ===== -->
  <path d="M470 152 H502 Q512 152 512 162 V200 Q512 210 522 210 H524" fill="none" stroke="#E50914" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470 342 H502 Q512 342 512 332 V294 Q512 284 522 284 H524" fill="none" stroke="#86868B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="163" width="200" height="168" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="554" y="233" font-size="14" font-weight="500" fill="#1D1D1F">Session intent</text>
  <text x="554" y="255" font-size="12" fill="#6E6E73">Stated where you spoke,</text>
  <text x="554" y="273" font-size="12" fill="#6E6E73">inferred where silent</text>
  <text x="554" y="295" font-size="11" fill="#86868B">Genre &#183; tone &#183; format &#183; unseen</text>

  <line x1="730" y1="247" x2="774" y2="247" stroke="#86868B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Rank &amp; build ===== -->
  <rect x="780" y="163" width="160" height="168" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="802" y="233" font-size="14" font-weight="500" fill="#1D1D1F">Rank &amp; build</text>
  <text x="802" y="255" font-size="12" fill="#6E6E73">Only real titles</text>
  <text x="802" y="273" font-size="12" fill="#6E6E73">Rules enforced</text>
  <text x="802" y="295" font-size="11" fill="#86868B">GenRec &#183; GenPage</text>

  <line x1="940" y1="247" x2="964" y2="247" stroke="#86868B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Results ===== -->
  <rect x="970" y="163" width="160" height="168" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="992" y="233" font-size="14" font-weight="500" fill="#1D1D1F">What you see</text>
  <text x="992" y="255" font-size="12" fill="#6E6E73">A row of titles</text>
  <text x="992" y="273" font-size="12" fill="#6E6E73">Each with a reason</text>
  <text x="992" y="295" font-size="11" fill="#86868B">GenPage rows</text>

  <!-- ===== Content side : the categorized catalog, entering from above ===== -->
  <rect x="743" y="58" width="235" height="66" rx="4" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="767" y="82" font-size="14" font-weight="500" fill="#1D1D1F">Categorized Catalog</text>
  <text x="767" y="101" font-size="12" fill="#6E6E73">Tone, genre, mood, story</text>
  <text x="767" y="117" font-size="11" fill="#86868B">MediaFM &#183; Knowledge Graph</text>
  <line x1="860" y1="124" x2="860" y2="157" stroke="#86868B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Refinement loop ===== -->
  <path d="M1050 331 V450 H840" fill="none" stroke="#86868B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="680" y="436" width="160" height="28" rx="4" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="760" y="454" font-size="12" fill="#6E6E73" text-anchor="middle">Refine, don&#8217;t restart</text>
  <path d="M680 450 H615 V337" fill="none" stroke="#86868B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ===== Legend ===== -->
  <rect x="30" y="500" width="12" height="12" rx="2" fill="#FFF0F1" stroke="#E50914" stroke-width="0.5"/>
  <text x="50" y="510" font-size="12" fill="#6E6E73">New</text>
  <rect x="100" y="500" width="12" height="12" rx="2" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="0.5"/>
  <text x="120" y="510" font-size="12" fill="#6E6E73">Already built and running at Netflix</text>
</svg>
